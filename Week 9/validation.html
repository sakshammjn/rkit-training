<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .success {
            border: 2px solid green;
        }

        .error {
            border: 2px solid red;
        }

        
        
    </style>

    <script src="../../node_modules/jquery/dist/jquery.min.js"></script>
</head>
<body>
    <h2>Validation Example</h2>
    <h3>Drivers' licence form fill up</h3>

    <form action="#" id="myForm">
        <input type="text" id="name" placeholder="Enter name" required minlength="5">
        <br>
        <br>

        <input type="email" id="email" placeholder="Enter valid email" required>
        <br>
        <br>

        <input type="tel" id="phone" placeholder="10 digit number" required>
        <br>
        <br>

        <input type="number" id="age" placeholder="age (18+)" required>
        <br>
        <br>

        <button type="submit">submit form</button>
    </form>
    
    <p id="status"></p>

    <script>
        $("#myForm").on("submit", function(e) {
            //dont submit yet
            e.preventDefault();

            let name = $("#name").val().trim();
            let email = $("#email").val().trim();
            let phone = $("#phone").val().trim();
            let age = $("#age").val().trim();

            let isValid = true;

            //name validation
            if (name.length < 5) {
                $("#name").addClass("error").removeClass("success");
                isValid = false;
            }
            else {
                $("#name").addClass("success").removeClass("error");
            }
            
            //email validation
            if (!$("#email")[0].checkValidity()) {
                $("#email").addClass("error").removeClass("success");
                isValid = false;
            }
            else {
                $("#email").addClass("success").removeClass("error");
            }

            //number validation
            if (phone.length < 10) {
                $("#phone").addClass("error").removeClass("success");
                isValid = false;
            }
            else {
                $("#phone").addClass("success").removeClass("error");
            }

            //age vaidation
            if (age < 18) {
                $("#age").addClass("error").removeClass("success");
                isValid = false;
            } 
            else {
                $("#age").addClass("success").removeClass("error");
            }


            let response = {
                name : name,
                email : email,
                tel : phone,
                age : age,
                isValid : isValid,
                message : isValid ? "submitted successfully" : "validation failed"

            }

            console.log(response);
            

            //finally check the isValid variable
            if (isValid) {
                $("#status").text("form submitted successfully");
            }
            else {
                $("#status").text("fix errors and try again");
            }


            

        })
    </script>
</body>
</html>
